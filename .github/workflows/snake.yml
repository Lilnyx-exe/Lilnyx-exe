
name: Generate Lilnyx Snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Red Neon Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Lilnyx-exe
          outputs: |
            dist/snake.svg?color_snake=%23FF1744&color_dots=%230D0D0D,%23330000,%238B0000,%23E60026,%23FF1744
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF1744&color_dots=%230D1117,%23330000,%238B0000,%23E60026,%23FF1744

      - name: Deploy SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
