name: Generate Contribution Games (Snake & Pac-Man)

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Generate Blood-Red Neon Snake Animation
      - name: Generate Neon Red Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff1744&color_dots=#120306,#3b050d,#750014,#ba0020,#ff1744
            dist/snake.svg?palette=github-dark&color_snake=#ff1744&color_dots=#120306,#3b050d,#750014,#ba0020,#ff1744
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff1744&color_dots=#120306,#3b050d,#750014,#ba0020,#ff1744

      # 2. Generate Pac-Man Contribution Maze Animation
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 3. Deploy all game animations to the output branch
      - name: Push all game SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
