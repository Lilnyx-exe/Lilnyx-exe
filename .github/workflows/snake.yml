
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Neon Red Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Lilnyx-exe
          outputs: |
            dist/snake.svg?color_snake=%23FF003C&color_dots=%230D0D0D,%23330000,%23660000,%23CC0033,%23FF1744
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF1744&color_dots=%230D1117,%23330000,%23660000,%23CC0033,%23FF1744

      - name: Publish Snake SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
