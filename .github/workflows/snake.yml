
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Lilnyx-exe
          outputs: |
            dist/snake.svg?color_snake=%2300E5FF&color_dots=%230D1117,%23003344,%23006677,%230099BB,%2300E5FF
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300E5FF

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
