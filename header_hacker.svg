<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="260">
  <defs>
    <!-- Dark Red Radial Gradient Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a0006" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0c0204" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#040102" stop-opacity="1" />
    </radialGradient>

    <!-- Intense Red Neon Glow Filters -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Laser Scan & HUD -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff0033" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ff0033" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="100%" stop-color="#ff1744" />
    </linearGradient>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(260px); opacity: 0; }
    }

    @keyframes glitch {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 1; }
      89% { transform: translate(-3px, 2px); text-shadow: 2px 0 #ff0055, -2px 0 #8b0000; }
      91% { transform: translate(3px, -1px); text-shadow: -2px 0 #ff0033, 2px 0 #ffffff; }
      93% { transform: translate(-2px, -2px); }
      95% { transform: translate(2px, 1px); }
      97% { transform: translate(0, 0); }
    }

    @keyframes glitchShadow {
      0%, 85%, 100% { opacity: 0; transform: translate(0, 0); }
      86% { opacity: 0.7; transform: translate(4px, 2px); }
      90% { opacity: 0.9; transform: translate(-4px, -1px); }
      94% { opacity: 0; }
    }

    @keyframes matrixFall {
      0% { transform: translateY(-120px); opacity: 0; }
      20% { opacity: 0.55; }
      80% { opacity: 0.55; }
      100% { transform: translateY(270px); opacity: 0; }
    }

    @keyframes pulseTarget {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.25; transform-origin: 475px 115px; }
      50% { transform: scale(1.08) rotate(180deg); opacity: 0.45; transform-origin: 475px 115px; }
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes eq1 { 0%, 100% { height: 8px; y: 152px; } 50% { height: 32px; y: 128px; } }
    @keyframes eq2 { 0%, 100% { height: 26px; y: 134px; } 50% { height: 10px; y: 150px; } }
    @keyframes eq3 { 0%, 100% { height: 16px; y: 144px; } 50% { height: 42px; y: 118px; } }
    @keyframes eq4 { 0%, 100% { height: 38px; y: 122px; } 50% { height: 14px; y: 146px; } }

    /* Classes */
    .bg-grid {
      stroke: #250207;
      stroke-width: 0.7;
      stroke-dasharray: 3 3;
    }
    .hud-line {
      stroke: #ff1744;
      stroke-width: 1.5;
      fill: none;
    }
    .hud-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #ff3344;
      letter-spacing: 1.5px;
    }
    .main-title {
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: #ffffff;
      animation: glitch 4s infinite;
      text-anchor: middle;
    }
    .main-title-glitch {
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: #ff0033;
      animation: glitchShadow 4s infinite;
      text-anchor: middle;
    }
    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: #ff6677;
      text-anchor: middle;
    }
    .cursor {
      animation: blinkCursor 0.9s infinite;
      fill: #ff1744;
    }
    .matrix-text {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #ff1744;
    }
  </style>

  <!-- Background Base -->
  <rect width="950" height="260" rx="14" fill="url(#bgGlow)" />
  <rect width="950" height="260" rx="14" stroke="#ff1744" stroke-width="1.2" fill="none" opacity="0.45" />

  <!-- Background Hex/Cyber Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="40" x2="950" y2="40" />
    <line x1="0" y1="90" x2="950" y2="90" />
    <line x1="0" y1="140" x2="950" y2="140" />
    <line x1="0" y1="190" x2="950" y2="190" />
    <line x1="0" y1="230" x2="950" y2="230" />
    <line x1="120" y1="0" x2="120" y2="260" />
    <line x1="280" y1="0" x2="280" y2="260" />
    <line x1="475" y1="0" x2="475" y2="260" />
    <line x1="670" y1="0" x2="670" y2="260" />
    <line x1="830" y1="0" x2="830" y2="260" />
  </g>

  <!-- Central Rotating Cyber Target Radar -->
  <g style="animation: pulseTarget 12s linear infinite;">
    <circle cx="475" cy="115" r="75" stroke="#ff0033" stroke-width="1.2" fill="none" stroke-dasharray="14 10" />
    <circle cx="475" cy="115" r="95" stroke="#ff1744" stroke-width="0.8" fill="none" stroke-dasharray="4 18" />
    <circle cx="475" cy="115" r="45" stroke="#8b0000" stroke-width="1" fill="none" />
    <line x1="475" y1="20" x2="475" y2="210" stroke="#ff1744" stroke-width="0.7" stroke-dasharray="6 6" />
    <line x1="380" y1="115" x2="570" y2="115" stroke="#ff1744" stroke-width="0.7" stroke-dasharray="6 6" />
  </g>

  <!-- Streaming Red Matrix Code Columns -->
  <g class="matrix-text">
    <text x="60" y="0" style="animation: matrixFall 4.2s linear infinite 0.3s;">0x7F 01 FF 9A E4</text>
    <text x="180" y="0" style="animation: matrixFall 5.1s linear infinite 1.2s;">BREACH INJECT</text>
    <text x="320" y="0" style="animation: matrixFall 4.5s linear infinite 0.7s;">101100101100</text>
    <text x="620" y="0" style="animation: matrixFall 4.8s linear infinite 1.5s;">ROOT ACCESS 00</text>
    <text x="760" y="0" style="animation: matrixFall 5.4s linear infinite 0.2s;">PAYLOAD DEPLOY</text>
    <text x="880" y="0" style="animation: matrixFall 4.1s linear infinite 1.8s;">0xDEADBEEF 11</text>
  </g>

  <!-- Cyber Equalizer Bars (Left & Right) -->
  <g fill="url(#barGrad)">
    <!-- Left Equalizer -->
    <rect x="75" width="4" rx="2" style="animation: eq1 1.2s ease-in-out infinite;" />
    <rect x="83" width="4" rx="2" style="animation: eq2 0.9s ease-in-out infinite 0.2s;" />
    <rect x="91" width="4" rx="2" style="animation: eq3 1.4s ease-in-out infinite 0.4s;" />
    <rect x="99" width="4" rx="2" style="animation: eq4 1.1s ease-in-out infinite 0.1s;" />
    
    <!-- Right Equalizer -->
    <rect x="845" width="4" rx="2" style="animation: eq4 1.1s ease-in-out infinite 0.3s;" />
    <rect x="853" width="4" rx="2" style="animation: eq2 0.9s ease-in-out infinite 0.1s;" />
    <rect x="861" width="4" rx="2" style="animation: eq1 1.3s ease-in-out infinite 0.5s;" />
    <rect x="869" width="4" rx="2" style="animation: eq3 1.0s ease-in-out infinite 0.2s;" />
  </g>

  <!-- HUD Corner Brackets & Framing -->
  <g class="hud-line">
    <!-- Top-Left -->
    <path d="M 22 45 L 22 22 L 55 22" />
    <circle cx="22" cy="22" r="3" fill="#ff1744" />
    
    <!-- Top-Right -->
    <path d="M 928 45 L 928 22 L 895 22" />
    <circle cx="928" cy="22" r="3" fill="#ff1744" />
    
    <!-- Bottom-Left -->
    <path d="M 22 215 L 22 238 L 55 238" />
    <circle cx="22" cy="238" r="3" fill="#ff1744" />
    
    <!-- Bottom-Right -->
    <path d="M 928 215 L 928 238 L 895 238" />
    <circle cx="928" cy="238" r="3" fill="#ff1744" />
  </g>

  <!-- HUD Telemetry Tags -->
  <g class="hud-text">
    <text x="35" y="32">[ NODE: 0xLILNYX // ROOT_OVERRIDE ]</text>
    <text x="735" y="32">[ SEC_CLEARANCE: LEVEL_05 ]</text>
    <text x="35" y="244">SYS: ACTIVE [100%]</text>
    <text x="475" y="244" text-anchor="middle" fill="#ff1744">● PROTOCOL: THINKING TEAM // DEFENSIVE_SHIELD ●</text>
    <text x="915" y="244" text-anchor="end">LOC: SRI_LANKA</text>
  </g>

  <!-- Horizontal Scanning Laser Beam -->
  <line x1="30" y1="0" x2="920" y2="0" stroke="url(#laserGrad)" stroke-width="2.5" filter="url(#softGlow)" style="animation: scanline 3.8s linear infinite;" />

  <!-- Main Center Header Text (Glitch Layer + Glow Layer) -->
  <g transform="translate(0, 0)">
    <!-- Glitch duplicate behind -->
    <text x="475" y="128" class="main-title-glitch" filter="url(#redGlow)">LILNYX.exe</text>
    
    <!-- Primary Title -->
    <text x="475" y="128" class="main-title" filter="url(#redGlow)">LILNYX.exe</text>
    
    <!-- Subtitle with Terminal Cursor -->
    <text x="475" y="172" class="subtitle" filter="url(#softGlow)">
      &gt; THINK DARK. CODE SMART. STAY UNSEEN. &lt;
    </text>
    <rect x="745" y="159" width="9" height="15" class="cursor" filter="url(#softGlow)" />
  </g>
</svg>
